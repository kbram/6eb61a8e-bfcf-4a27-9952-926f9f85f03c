version: '3.8'
services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
  test:
    build: .
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan test --filter=ReportServiceTest
